<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAID 관전</title>
<link rel="stylesheet" href="/assets/raid.css">
<script src="/assets/raid.js"></script>
</head>
<body>
<div class="page">
  <div class="tabs" id="tabs"></div>
  <div id="root"></div>
</div>
<script>
navBar('watch');
const fixedId = location.pathname.startsWith('/w/') ? decodeURIComponent(location.pathname.slice(3)) : '';
let data = { battles: [] }, skew = 0, selected = fixedId || decodeURIComponent(location.hash.slice(1));
let myName = localStorage.getItem('raidWatcherName') || '', cheerMsg = null;

/* 관전자는 이름을 넣고 들어온다. 채팅은 없고 응원 버튼만 있다. */
function gate(err) {
  $('tabs').innerHTML = '';
  $('root').innerHTML = `<div class="card" style="max-width:360px;margin:40px auto">
    <div class="card-h"><h2>관전 입장</h2></div>
    <p class="sub">다른 관전자와 참여자에게 보일 이름을 넣어 주세요 (12자까지). 관전 중에는 응원 버튼만 누를 수 있어요.</p>
    ${err ? `<div class="msg err">${esc(err)}</div>` : ''}
    <div class="btns" style="flex-wrap:nowrap"><input id="wname" maxlength="12" value="${esc(myName)}" autofocus><button class="primary" id="enter">입장</button></div></div>`;
  const go = async () => {
    try { myName = (await api('/api/watch/hello', { name: $('wname').value })).name; localStorage.setItem('raidWatcherName', myName); start(); }
    catch (e) { gate(e.message); }
  };
  $('enter').onclick = go; $('wname').onkeydown = e => { if (e.key === 'Enter') go(); };
}
let started = false;
function start() {
  if (started) return load();
  started = true;
  live(load);
  startTimers(() => data.battles, () => skew);
  setInterval(() => api('/api/watch/hello', { name: myName }).catch(() => {}), 30000);
}
async function cheer(kind) {
  try { await api('/api/cheer', { id: selected, name: myName, kind }); cheerMsg = null; }
  catch (e) { cheerMsg = e.message; render(); }
}

async function load() {
  data = await api('/api/battles');
  skew = data.now - Math.floor(Date.now() / 1000);
  render();
}

function render() { keepInputs(draw); overlayEvents((data.battles || []).filter(b => b.id === selected)); initRings(() => data.battles || [], () => skew); }
function draw() {
  const list = (data.battles || []).filter(b => !fixedId || b.id === fixedId);
  if (fixedId && !list.length) { $('tabs').innerHTML = ''; $('root').innerHTML = '<div class="card empty">이 전투는 끝났거나 없는 주소예요. <a href="/watch">진행 중인 전투 보기</a></div>'; return; }
  if (!list.length) { $('tabs').innerHTML = ''; $('root').innerHTML = '<div class="card empty">진행 중인 레이드가 없습니다.</div>'; return; }
  if (!list.find(b => b.id === selected)) selected = list[0].id;
  $('tabs').innerHTML = list.length > 1 ? list.map(b =>
    `<button class="${b.id === selected ? 'on' : ''}" data-id="${esc(b.id)}">${esc(b.creature?.name || '전투')}${b.active ? '' : ' · 종료'}</button>`).join('') : '';
  $('tabs').querySelectorAll('button').forEach(x => x.onclick = () => { selected = x.dataset.id; history.replaceState(null, '', '#' + selected); render(); });

  const b = list.find(x => x.id === selected);
  $('root').innerHTML = `
  <div class="stage">
    <div class="leftcol"><div class="card"><div class="panel-h">러너 팀 · ${(b.runners || []).length}명</div>${teamHTML(b)}</div>
      <div class="card chatcard"><div class="card-h"><h2>채팅</h2><span class="sub">보기 전용</span></div>${chatHTML(b)}</div></div>
    <div class="card center">
      <div class="status" style="text-align:left"><span><b>${b.phase === 'lobby' ? '대기' : b.phase === 'prep' ? '준비' : b.round + '라운드'}</b> <span class="sub">${esc(b.active ? (PHASE[b.phase] || '') : '전투 종료')}</span></span>
        <span class="timer">${b.phase === 'battle' ? `제출 ${(b.submitted || []).length}/${b.required}` : ''}</span></div>
      ${gridHTML(b)}
      ${ringHTML(b, skew)}
      <div class="sub">${b.active ? (b.phase === 'battle' ? '행동 입력 마감까지' : b.phase === 'prep' ? '시작 위치 입력 마감까지' : b.phase === 'lobby' ? '참여자들이 준비하는 중이에요' : esc(PHASE[b.phase] || '')) : '전투가 끝났습니다'}</div>
    </div>
    <div>
      <div class="card"><div class="panel-h boss">보스</div>${bossCardHTML(b)}</div>
      <div class="card"><div class="card-h"><h2>응원하기</h2><span class="sub">${esc(myName)} 님 · <a href="#" id="rename">이름 바꾸기</a></span></div>
        ${cheerMsg ? `<div class="msg err">${esc(cheerMsg)}</div>` : ''}
        ${b.active ? `<div class="cheerbtns">${Object.entries(CHEERS).map(([k, t]) => `<button data-cheer="${k}">${t}<span class="n">${b.cheers?.counts?.[k] || ''}</span></button>`).join('')}</div>` : '<div class="sub">끝난 전투에는 응원할 수 없어요.</div>'}
        ${cheerFeedHTML(b, 4)}</div>
      <div class="card"><div class="card-h"><h2>전투 기록</h2><span class="sub">최신이 위</span></div><div class="log" style="max-height:460px">${logHTML(b, b.active ? 30 : 200)}</div></div>
    </div>
  </div>`;
  document.querySelectorAll('[data-cheer]').forEach(x => x.onclick = () => cheer(x.dataset.cheer));
  bindChat(() => {});
  $('rename').onclick = e => { e.preventDefault(); gate(); };
}
myName ? api('/api/watch/hello', { name: myName }).then(start).catch(e => gate(e.message)) : gate();
</script>
</body>
</html>
